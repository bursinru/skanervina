services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: scanner
      POSTGRES_USER: scanner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scanner -d scanner"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  recognition:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://scanner:${POSTGRES_PASSWORD}@db:5432/scanner
      CATALOG_CSV: /catalog/strapi_output0709_enriched.csv
      STATIC_DIR: /app/public
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CV_ENABLED: "true"
      HF_HOME: /models
      CV_DEVICE: cpu
      SCANNER_ADMIN_TOKEN: ${SCANNER_ADMIN_TOKEN:-}
    volumes:
      - ./Датасет:/catalog:ro
      - model-cache:/models
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      NUXT_RECOGNITION_URL: http://recognition:8080
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - recognition
    restart: unless-stopped
volumes:
  postgres-data:
  model-cache:
